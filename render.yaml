services:
	- type: web
		name: movie-recommender-api
		runtime: python
		plan: free
		rootDir: backend
		buildCommand: pip install -r requirements.txt
		startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
		envVars:
			- key: FRONTEND_URLS
				value: http://localhost:5173
			- key: TMDB_TOKEN
				sync: false
